name: Deploy to Buzzertest Server

on:
  push:
    branches:
      - dev
      - dev-stream
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python Syntax & Build Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Requirements & Syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app.py

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            BRANCH="${{ github.ref_name }}"
            echo "Deploying branch $BRANCH to buzzertest.kuropixel.de..."
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            # 1. Virtuelle Python-Umgebung erstellen/nutzen
            if [ ! -d "venv" ]; then
              python3 -m venv venv || virtualenv venv
            fi

            if [ -d "venv" ]; then
              source venv/bin/activate
              INTERPRETER="./venv/bin/python"
            else
              INTERPRETER="python3"
            fi

            # 2. Pakete in die Umgebung installieren
            pip install --upgrade pip
            pip install -r requirements.txt

            # 3. PM2-Prozess sauber neu registrieren & starten
            pm2 delete buzzertest 2>/dev/null || true
            pm2 start app.py --name "buzzertest" --interpreter "$INTERPRETER"
            pm2 save
