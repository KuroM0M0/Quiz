{% extends "base.html" %}

{% block head_meta %} 
    <meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block title %} KuroBuzz {% endblock %}
{% block content %}
<br><br><br>
<div class="columns">
    <div class="column zentriert">
        <button class="button" onclick="WartungsNachricht()">Nachricht für alle hinterlassen</button>
    </div>
    <div class="column zentriert">
        <button class="button" onclick="WartungsNachrichtRemove()">Nachricht löschen</button>
    </div>
</div>

<br><br><br><br>


<div class="columns is-multiline">
    {% for card in cards %}
    <div class="column">
        <div class="card cardDash">
            <header class="card-header">
                <p class="card-header-title"><span>{{ card.name }}</span></p>
            </header>
            <div class="card-content">
                <div class="content">{{ card.text }}</div>
            </div>
            <footer class="card-footer">
                <p class="card-footer-item">
                    <button class="button is-danger is-small" onclick="deleteCard(this, '{{ card.name }}', '{{ card.text }}')">
                        <i class="fas fa-minus"></i>
                    </button>    
                </p>
            </footer>
        </div>
    </div>
    {% endfor %}
</div>



{% endblock %}
