{% extends "base.html" %}

{% block head_meta %} 
    <meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block title %} KuroBuzz - Host {% endblock %}
{% block content %}

<div class="columns black">
    <div class="column is-one-fifth überschrift">
        <h1 class="title"><a href="/">KuroBuzz</a></h1>
    </div>
    <div class="column is-three-fifth">
        <div class="überschrift" id="roomCode"> 
            
        </div>
    </div>
    <div class="column is-one-fifth zentriertFlex">
        <div class="dropdown is-right" id="settings">
        <div class="dropdown-trigger">
            <!-- Das Zahnrad-Icon in hellem Text für den Dark Mode -->
            <button class="button is-ghost p-0" onclick="toggleSettingsMenu()">
                <span class="icon is-large">
                    <i class="fas fa-cog fa-2x has-text-light"></i>
                </span>
            </button>
        </div>
        <div class="dropdown-menu" role="menu">
            <!-- p-3 für den schwebenden Look. Der Hintergrund passt sich deinem restlichen Darkmode an -->
            <div class="dropdown-content p-3" style="width: 240px;">
                
                <!-- Haupt-Trigger für die Sounds (Jetzt passend in is-dark) -->
                <button class="button is-dark is-fullwidth is-justify-content-space-between mb-2" onclick="toggleBuzzerSounds()">
                    <span class="has-text-weight-semibold has-text-light">Sound Settings</span>
                    <span class="icon is-small">
                        <i class="fas fa-chevron-down has-text-light" id="buzzer-chevron"></i>
                    </span>
                </button>
                
                <!-- Eingerücktes Untermenü mit sattem, dunklem Hintergrund -->
                <div id="buzzer-sounds-list" class="is-hidden py-2 px-1 mb-2 has-background-grey-darker" style="border-radius: 6px;">
                    <!-- Die Buttons nutzen jetzt is-dark, um sich dezent vom Hintergrund abzuheben -->
                    <button class="button is-dark is-small is-fullwidth mb-1" onclick="changeBuzzerSound('BuzzerLang')">BuzzerLang</button>
                    <button class="button is-dark is-small is-fullwidth mb-1" onclick="changeBuzzerSound('BuzzerKurz')">BuzzerShort</button>
                    <button class="button is-dark is-small is-fullwidth mb-1" onclick="changeBuzzerSound('Meow')">Meow</button>
                    <button class="button is-dark is-small is-fullwidth mb-2" onclick="changeBuzzerSound('Quak')">Quak</button>
                    
                    <hr class="dropdown-divider my-2" style="background-color: #4a4a4a;" />
                    
                    <!-- Textfarbe explizit auf hell gesetzt -->
                    <p class="subtitle is-6 mb-2 pl-1 has-text-light">Lautstärke:</p>
                    <div class="px-1">
                        <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="changeBuzzerVolume(this.value)" class="slider is-fullwidth">
                    </div>
                </div>

                <hr class="dropdown-divider my-2" />
                
                <!-- "Spieler entfernen" in sattem Rot (is-danger) statt hellem Rosa -->
                <button class="button is-danger is-fullwidth mb-2" onclick="kickPlayer()">
                    <span class="icon is-small">
                        <i class="fas fa-user-slash"></i>
                    </span>
                    <span>Spieler entfernen</span>
                </button>
                
                <hr class="dropdown-divider my-2" />

                <!-- Raum-Status Toggle -->
                <div class="field has-addons is-justify-content-center">
                    <p class="control">
                        <button class="button is-static is-small">Raum-Status:</button>
                    </p>
                    <p class="control">
                        <button class="button is-success is-small" id="btn-toggle-join" onclick="toggleJoinability()">
                            <span class="icon is-small">
                                <i class="fas fa-unlock" id="join-icon"></i>
                            </span>
                            <span id="join-text">Offen</span>
                        </button>
                    </p>
                </div>
                </div>
            </div>
        </div>
        <div class="überschrift" id="closeRoom">
            <button class="title redText" onclick="closeRoom()">Raum schließen</button>
        </div>
    </div>
</div>

<div class="columns">
    <div class="column">
        <div class="toolbar-groups">
            <div class="buttons">
                <button class="button is-primary abstandLinks" onclick="sendQuestion()"><span title="Jeder Spieler sieht gleichzeitig die eingegebene Frage">Sende Frage</span></button>
                <button class="button is-primary" onclick="startTimer()"><span title="Wenn Timer abgelaufen: Textfeld sperrt sich">Starte Timer</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="buttons">
                <button class="button" onclick="lockBuzzer(this)"><span title="Sperrt den Buzzer für alle Spieler">Lock Buzzer</span></button>
                <button id="lockTextButton" class="button" onclick="lockText(this)"><span title="Sperrt das Textfeld aller Spieler">Lock Text</span></button>
                <button class="button" onclick="answerInput(this)"><span title="Spieler erhalten Button, womit sie ihr eigenes Textfeld sperren können. Du siehst das dann als Braun hinterlegt.">Antwort abgeben</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="buttons">
                <button id="resetBuzzer" class="button is-danger" onclick="onBuzzerReset()">Reset Buzzer</button>
                <button class="button is-danger" onclick="clearText()"><span title="Entfernt den Text aller Spieler und die gestellte Frage">Clear Text</span></button>
            </div>
            <h1 id="timerDisplay" class="subtitle is-3">00:00</h1>
        </div>
    </div>
</div>



<!--<button id="firstBuzz" class="button" onclick="buttonActiveToggle(this)">Only first Buzz</button> Button hat keine funktion -->

<div class="columns">
    <div class="column is-four-fifths">
        <div id="card" class="columns is-multiline is-narrow-tablet">

        </div>
    </div>
    <div class="column">
        <div id="app">
            <table class="table playerList is-striped is-hoverable is-bordered">
                <tbody id="playerList">
                    <tr>
                        <th>Spieler</th>
                        <th @click="toggleSort()" style="cursor: pointer; user-select: none;">
                            Punkte 
                            <span v-if="sortDescending">⬇️</span>
                            <span v-else>⬆️</span>
                        </th>
                    </tr>
                    <tr v-for="player in sortedPlayersList" :key="player.name">
                        <th v-text="player.name"></th> 
                        <th v-text="player.points"></th>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

    

<script> 
    let roomID = "{{ roomID }}";
    const username = "{{ session['username'] }}";

    window.addEventListener('DOMContentLoaded', () => {
        if (roomID && roomID !== "None") {
            const roomCodeDiv = document.getElementById('roomCode');
            roomCodeDiv.innerHTML = `<h1 class="title roomCode">Room Code: ${roomID} <button class="subtitle" onclick="toggleCode()"><i class="fas fa-eye"></i></button></h1>`;
            socket.emit('join_room', {roomID: roomID, host: username});
            socket.emit("playLoaded", {roomID: roomID});
        } else {
            createRoom(); //Beim seiten neuladen wird neuer Raum erstellt, wenn noch keiner existiert
        }
    });

    setTimeout(() => {
        if (!roomID || roomID === "None") {
            roomID = document.getElementById("roomCode").textContent.split("Room Code:")[1].trim();
        }
        console.log(roomID);
    }, 5000);
</script>

{% endblock %}
