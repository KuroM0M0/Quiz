{% extends "base.html" %}

{% block head_meta %} 
    <meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block title %} KuroBuzz {% endblock %}
{% block content %}

<div class="columns black">
    <div class="column is-one-fifth überschrift">
        <h1 class="title"><a href="/">KuroBuzz</a></h1>
    </div>
    <div class="column">
        <div class="überschrift" id="roomCodeDiv"> 
            
        </div>
    </div>
    <div class="column is-one-fifth zentriertFlex">
        <div class="dropdown is-right" id="settings">
            <div class="dropdown-trigger">
                <button class="fas fa-cog fa-3x" onclick="toggleSettingsMenu()"></button>
            </div>
            <div class="dropdown-menu" role="menu">
                <div class="dropdown-content">
                    <p class="dropdown-item">Buzzer Sounds:</p>
                    <hr class="dropdown-divider" />
                    <button class="button dropdown-item kleinAbstandOben" onclick="changeBuzzerSound('BuzzerLang')">BuzzerLang</button>
                    <button class="button dropdown-item kleinAbstandOben" onclick="changeBuzzerSound('BuzzerKurz')">BuzzerShort</button>
                    <button class="button dropdown-item kleinAbstandOben" onclick="changeBuzzerSound('Meow')">Meow</button>
                    <button class="button dropdown-item kleinAbstandOben" onclick="changeBuzzerSound('Quak')">Quak</button>
                    <hr class="dropdown-divider" />
                    <p class="dropdown-item">Lautstärke:</p>
                        <div class="dropdown-item">
                            <input type="range" id="volumeSlider" min="0" max="100" value="100"
                                oninput="changeBuzzerVolume(this.value)" style="width: 100%;">
                        </div>
                    <!-- <p class="dropdown-item">Other Settings:</p> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="columns">
    <div class="column animiert">
        <div id="app">
            <table class="table playerList is-striped is-hoverable is-bordered">
                <tbody id="playerList">
                    <tr>
                        <th>Spieler</th>
                        <th @click="toggleSort()" style="cursor: pointer; user-select: none;">
                            Punkte 
                            <span v-if="sortDescending">⬇️</span>
                            <span v-else>⬆️</span>
                        </th>
                    </tr>
                    <tr v-for="player in sortedPlayersList" :key="player.name">
                        <th v-text="player.name"></th> 
                        <th v-text="player.points"></th>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="column animiert delay2">
        <br><br>
        <div class="zentriert">
            <p class="subtitle is-3" id="whoBuzzed"></p>
        </div>
        <div class="buzzer-container">
            <button class="button buzzer" id="buzzer" onclick="onBuzzerClick()">Buzzer</button>
        </div>
    </div>
    <div class="column">
        <!-- Rechte Spalte zur Zentrierung des Buzzers im 3-Spalten-Grid -->
    </div>
</div>

<div class="zentriert animiert delay2">
    <h1 id="timerDisplay" class="subtitle is-2">
        00:00
    </h1>
</div>
<br>
<div class="zentriert">
    <div id="qCard" class="questionCard" style="opacity:0;">
        <span id="qText"></span>
        <div id="qImageWrapper" class="player-image-wrapper unsichtbar">
            <img id="playerQuestionImage" src="" alt="Quiz Bild" onclick="openPlayerImageLightbox()" title="Klicke für Vollbild-Ansicht">
            <div class="player-image-hint" onclick="openPlayerImageLightbox()">
                <i class="fas fa-search-plus mr-1"></i><span>Klick zum Vergrößern</span>
            </div>
        </div>
        <div id="playerAudioIndicator" class="tag is-info is-light mt-2 unsichtbar">
            <i class="fas fa-volume-up mr-1 audio-icon-pulse"></i>&nbsp;<span>Audio läuft</span>
        </div>
    </div>
</div>
<audio id="playerQuestionAudio" preload="auto" playsinline style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></audio>

<div class="zentriert animiert delay2">
    <textarea class="input answerInput has-fixed-size" placeholder="Deine Antwort" name="InputField" id="{{ username }}Input" oninput="onTextChange(username)"></textarea>
    <br><br>
    <button class="button is-primary unsichtbar" id="submitAnswer" onclick="lockSubmitAnswer(username, this)">Antwort abgeben</button>
</div>

<!-- Vollbild-Lightbox für das Quiz-Bild der Teilnehmer -->
<div class="modal" id="playerImageModal">
    <div class="modal-background" onclick="closePlayerImageLightbox()"></div>
    <div class="modal-content player-lightbox-content">
        <p class="image">
            <img id="playerLightboxImage" src="" alt="Quiz Bild Großansicht" onclick="closePlayerImageLightbox()" style="cursor: zoom-out;">
        </p>
    </div>
    <button class="modal-close is-large" aria-label="close" onclick="closePlayerImageLightbox()"></button>
</div>



<script>
    const roomCodeDiv = document.getElementById('roomCodeDiv');
    const roomID = "{{ session['roomID'] }}";
    const username = "{{ session['username'] }}";
    roomCodeDiv.innerHTML = `<h1 class="title" id="roomCode">Room Code: ${roomID}</h1>`;
    socket.emit('join_room', {roomID: roomID, username: username});

    window.addEventListener('DOMContentLoaded', () => {
        socket.emit("playLoaded", {roomID: roomID})
    });
</script>

{% endblock %}
